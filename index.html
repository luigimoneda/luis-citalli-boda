<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luis & Citlalli | Nuestra Boda</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#f5efe6;
  --green:#3A5A40;
  --gold:#c6a96b;
  --text:#2c3e2f;
}

*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth;}

body{
  font-family:'Montserrat', sans-serif;
  background:var(--cream);
  color:var(--text);
  overflow-x:hidden;
}

/* TEXTURA PAPEL */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url('https://www.transparenttextures.com/patterns/paper-fibers.png');
  opacity:0.25;
  z-index:-1;
}

section{
  padding:120px 20px;
  text-align:center;
}

/* MONOGRAMA INTRO */
.intro{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.monograma{
  width:120px;
  opacity:0;
  transform:scale(0.8);
  animation:fadeScale 1.5s ease forwards;
}

/* HERO NOMBRES */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.hero h1{
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(3rem,8vw,5rem);
  color:var(--green);
}

.hero p{
  margin-top:15px;
  letter-spacing:3px;
  color:var(--gold);
}

/* FOTO FULL */
.photo{
  height:100vh;
  background:url('img/photo1.jpg') center/cover no-repeat;
}

/* HISTORIA */
.story{
  max-width:700px;
  margin:auto;
  font-family:'Cormorant Garamond', serif;
  font-size:1.6rem;
  line-height:1.8;
}

.title{
  font-family:'Cormorant Garamond', serif;
  font-size:2.5rem;
  color:var(--green);
  margin-bottom:30px;
}

/* ANIMACIONES */
.fade{
  opacity:0;
  transform:translateY(40px);
  transition:1s;
}

.fade.visible{
  opacity:1;
  transform:translateY(0);
}

@keyframes fadeScale{
  to{opacity:1;transform:scale(1);}
}

</style>
</head>
<body>

<!-- INTRO MONOGRAMA -->
<section class="intro">
  <img src="img/monograma.png" class="monograma">
</section>

<!-- HERO NOMBRES -->
<section class="hero fade">
  <h1>Citlalli & Luis</h1>
  <p>11 DE JULIO 2026</p>
</section>

<!-- FOTO -->
<section class="photo"></section>

<!-- HISTORIA -->
<section class="fade">
  <h2 class="title">Nuestra historia</h2>
  <p class="story">
    Entre miles de caminos, nuestras vidas se encontraron.
    
    Y sin darnos cuenta, nos convertimos en el hogar del otro.
    
    Hoy, elegimos caminar juntos para siempre.
  </p>
</section>

<script>

/* FADE IN */
const observer = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('visible');
    }
  });
},{threshold:0.2});

document.querySelectorAll('.fade').forEach(el=>observer.observe(el));

</script>

</body>
</html>
