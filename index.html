<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luis & Citlalli - 11.07.26</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --olivo: #556b2f;
            --crema: #fffdfa;
            --dorado: #b8860b;
            --rojo: #8b0000;
            --texto: #2f2f2f;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--crema);
            color: var(--texto);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 90%;
            margin: 40px 20px;
            border: 1px solid var(--olivo);
            padding: 40px;
            position: relative;
            background-color: var(--crema);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            text-align: center;
        }

        header {
            border-bottom: 1px solid var(--dorado);
            padding-bottom: 30px;
            margin-bottom: 40px;
        }

        .names {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            color: var(--olivo);
            margin: 0;
            font-weight: 300;
        }

        .ampersand {
            color: var(--rojo);
            font-style: italic;
            display: block;
            font-size: 2rem;
            margin: -10px 0;
        }

        /* Estilos del Contador */
        .countdown-container {
            margin: 40px 0;
            padding: 20px 0;
            border-top: 1px double var(--dorado);
            border-bottom: 1px double var(--dorado);
        }

        .countdown-title {
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: var(--olivo);
        }

        .timer {
            display: flex;
            justify-content: space-around;
            max-width: 400px;
            margin: 0 auto;
        }

        .time-segment {
            display: flex;
            flex-direction: column;
        }

        .number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: var(--rojo);
            font-weight: 300;
        }

        .label {
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--olivo);
        }

        .details {
            line-height: 2;
            font-weight: 200;
            letter-spacing: 1px;
            margin: 40px 0;
        }

        .btn-rsvp {
            display: inline-block;
            padding: 15px 40px;
            background-color: var(--olivo);
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: 0.4s;
            border: 1px solid var(--olivo);
        }

        .btn-rsvp:hover {
            background-color: transparent;
            color: var(--olivo);
        }

        footer {
            margin-top: 40px;
            font-size: 0.7rem;
            opacity: 0.5;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <p style="letter-spacing: 5px; font-size: 0.6rem; text-transform: uppercase;">Estás invitado a la boda de</p>
            <h1 class="names">Luis <span class="ampersand">&</span> Citlalli</h1>
        </header>

        <section class="details">
            <p style="color: var(--dorado); font-weight: 400;">SÁBADO</p>
            <h2 style="font-family: 'Cormorant Garamond'; font-size: 2rem; margin: 10px 0;">11 de Julio de 2026</h2>
            <p>18:00 HRS. <br> Hacienda Los Olivos</p>
        </section>

        <div class="countdown-container">
            <div class="countdown-title">Faltan solo</div>
            <div class="timer">
                <div class="time-segment">
                    <span class="number" id="days">00</span>
                    <span class="label">Días</span>
                </div>
                <div class="time-segment">
                    <span class="number" id="hours">00</span>
                    <span class="label">Horas</span>
                </div>
                <div class="time-segment">
                    <span class="number" id="minutes">00</span>
                    <span class="label">Min.</span>
                </div>
                <div class="time-segment">
                    <span class="number" id="seconds">00</span>
                    <span class="label">Seg.</span>
                </div>
            </div>
        </div>

        <div style="margin-top: 30px;">
            <a href="https://wa.me/TUNUMERO" class="btn-rsvp">Confirmar Asistencia</a>
        </div>

        <footer>L & C — 2026</footer>
    </div>

    <script>
        // Configura la fecha aquí (Mes es 0-11, Julio es 6)
        const weddingDate = new Date(2026, 6, 11, 18, 0, 0).getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours;
            document.getElementById("minutes").innerHTML = minutes;
            document.getElementById("seconds").innerHTML = seconds;

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown-container").innerHTML = "<div class='countdown-title'>¡Hoy es el gran día!</div>";
            }
        }, 1000);
    </script>
</body>
</html>
