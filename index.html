<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luis & Citlalli | Nuestra Boda</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#f5efe6;
  --green:#3A5A40;
  --gold:#c6a96b;
  --text:#2c3e2f;
}

*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth;}

body{
  font-family:'Montserrat', sans-serif;
  background:var(--cream);
  color:var(--text);
  overflow-x:hidden;
}

/* TEXTURA PAPEL */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url('https://www.transparenttextures.com/patterns/paper-fibers.png');
  opacity:0.25;
  z-index:-1;
}

section{
  padding:80px 20px; /* menos espacio */
  text-align:center;
}

/* MONOGRAMA OVERLAY */
.intro-overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--cream);
  z-index:9999;
  animation:fadeOut 1.2s ease 1.5s forwards;
}

.monograma{
  width:120px;
  opacity:0;
  transform:scale(0.8);
  animation:fadeScale 1.5s ease forwards;
}

/* HERO NOMBRES */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.hero h1{
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(3rem,8vw,5rem);
  color:var(--green);
  opacity:0;
  transform:translateY(30px);
  animation:fadeUp 1.5s ease 1.5s forwards; /* entra después del monograma */
}

.hero p{
  margin-top:15px;
  letter-spacing:3px;
  color:var(--gold);
  opacity:0;
  transform:translateY(30px);
  animation:fadeUp 1.5s ease 1.8s forwards;
}

/* FOTO FULL */
.photo{
  position:relative;
  height:100vh;
  overflow:hidden;
}

/* IMAGEN CON PARALLAX */
.photo-bg{
  position:absolute;
  inset:0;
  background:url('img/hero.jpg') center/cover no-repeat;
  transform:scale(1.1);
  will-change:transform;
  z-index:0;
}

/* OVERLAY SUAVE (para integrar mejor) */
.photo::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.15);
  z-index:1;
}

  /* BORDE SUPERIOR */
.photo::before{
  content:"";
  position:absolute;
  top:-1px;
  left:0;
  width:100%;
  height:120px;
  background:url('img/torn-top.png') repeat-x;
  background-size:cover;
  z-index:2;
}

/* BORDE INFERIOR */
.photo-edge-bottom{
  position:absolute;
  bottom:-1px;
  left:0;
  width:100%;
  height:120px;
  background:url('img/torn-bottom.png') repeat-x;
  background-size:cover;
  z-index:2;
}

/* HISTORIA */
.story{
  max-width:700px;
  margin:auto;
  font-family:'Cormorant Garamond', serif;
  font-size:1.6rem;
  line-height:1.8;
}

.title{
  font-family:'Cormorant Garamond', serif;
  font-size:2.3rem;
  color:var(--green);
  margin-bottom:25px;
}

/* ANIMACIONES SCROLL */
.fade{
  opacity:0;
  transform:translateY(40px);
  transition:1s ease;
}

.fade.visible{
  opacity:1;
  transform:translateY(0);
}

@keyframes fadeScale{
  to{opacity:1;transform:scale(1);}
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden;}
}

@keyframes fadeUp{
  to{opacity:1;transform:translateY(0);}
}

</style>
</head>
<body>

<!-- MONOGRAMA OVERLAY -->
<div class="intro-overlay">
  <img src="img/monograma.png" class="monograma">
</div>

<!-- HERO NOMBRES -->
<section class="hero">
  <h1>Citlalli & Luis</h1>
  <p>11 DE JULIO 2026</p>
</section>

<!-- FOTO -->
<section class="photo">
  <div class="photo-bg" id="photoBg"></div>
  <div class="photo-edge-bottom"></div>
</section>

<!-- HISTORIA -->
<section class="fade">
  <h2 class="title">Nuestra historia</h2>
  <p class="story">
    Entre miles de caminos, nuestras vidas se encontraron.
    
    Y sin darnos cuenta, nos convertimos en el hogar del otro.
    
    Hoy, elegimos caminar juntos para siempre.
  </p>
</section>

<script>

/* FADE SCROLL */
const observer = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('visible');
    }
  });
},{threshold:0.2});

document.querySelectorAll('.fade').forEach(el=>observer.observe(el));

  const photoBg = document.getElementById('photoBg');

window.addEventListener('scroll', () => {
  const rect = photoBg.parentElement.getBoundingClientRect();
  photoBg.style.transform = `translateY(${rect.top * 0.2}px) scale(1.1)`;
});
  
</script>

</body>
</html>
