<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luis & Citlalli | Nuestra Boda</title>
    
    <link rel="icon" type="image/png" href="img/monograma.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-cream: #f9f8f4;
            --white: #ffffff;
            --olive-dark: #3A5A40;
            --olive-medium: #6B705C;
            --text-main: #2c3e2f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- HERO: NOMBRES CON MONOGRAMA DE FONDO --- */
        .hero {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative; /* Necesario para posicionar el monograma absoluto */
            overflow: hidden; /* Evita que el monograma gigante desborde */
        }

        /* El Monograma como Marca de Agua de Fondo */
        .hero-monograma-bg {
            position: absolute;
            /* Lo centramos perfectamente */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* Lo hacemos enorme para que rellene */
            width: 120vw; /* Más ancho que la pantalla */
            max-width: 1200px; /* Pero con un límite en PC */
            height: auto;
            /* LA CLAVE: Transparencia y filtros */
            opacity: 0.06; /* Muy, muy sutil para no distraer */
            filter: grayscale(1); /* Lo convertimos a gris para que no compita en color */
            z-index: 1; /* Detrás del texto */
            pointer-events: none; /* No interfiere con clics */
            animation: fadeInScale 2.5s ease-out; /* Animación suave al cargar */
        }

        .hero-content {
            position: relative;
            z-index: 2; /* Por encima del monograma */
        }

        .hero h1 { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: clamp(4rem, 18vw, 10rem); 
            color: var(--olive-dark);
            line-height: 0.85;
            font-weight: 400;
            margin-bottom: 25px;
            animation: fadeInUp 1.5s ease;
        }

        .hero-date {
            letter-spacing: clamp(4px, 1.5vw, 10px);
            color: var(--olive-medium);
            font-size: clamp(0.8rem, 2.5vw, 1.3rem);
            text-transform: uppercase;
            animation: fadeIn 2s ease;
        }

        /* --- CONTENEDOR DE FOTO: ESPACIO AJUSTADO --- */
        .photo-section {
            width: 100%;
            height: 75vh; 
            margin-top: 0; /* Eliminamos el margen superior para que empiece justo después del Hero */
            margin-bottom: 120px; /* Espacio generoso después de la foto */
            overflow: hidden;
            position: relative;
            z-index: 3; /* Asegura que la foto esté arriba en el scroll */
        }

        .main-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            box-shadow: 0 15px 35px rgba(58, 90, 64, 0.1);
        }

        @media (max-width: 768px) {
            .photo-section {
                height: 60vh; 
                margin-bottom: 80px;
            }
        }

        /* SECCIONES POSTERIORES */
        section { padding: 80px 20px; max-width: 900px; margin: auto; text-align: center; }

        .dedicatoria {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-style: italic;
            color: var(--olive-medium);
            line-height: 1.4;
            margin-bottom: 40px;
        }

        .section-title { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: var(--olive-dark);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* --- DIVISORES BOTÁNICOS --- */
        .divider-png { 
            display: block; 
            width: 100%; 
            max-width: 450px; 
            margin: 100px auto;
            opacity: 0.9; 
            filter: sepia(0.2); 
            text-align: center;
        }

        .divider-png img { 
            width: 80%; 
            height: auto; 
        }

        @media (max-width: 600px) {
            .divider-png {
                max-width: 300px; 
                margin: 70px auto;
            }
        }

        .countdown { display: flex; justify-content: center; gap: 30px; }
        .time-box span { display: block; font-size: 3.5rem; font-family: 'Cormorant Garamond', serif; color: var(--olive-dark); font-weight: 600; }

        /* --- ACTUALIZACIÓN DE ESTILO PARA EVENTOS (TIPO IMAGEN) --- */
    .event-card {
        background: transparent; /* Quitamos el fondo blanco de la tarjeta para que sea minimalista */
        padding: 40px 20px;
        margin-bottom: 60px;
        border: none; /* Quitamos bordes y sombras pesadas */
        box-shadow: none;
        text-align: center;
    }

    .event-time {
        font-family: 'Montserrat', sans-serif;
        font-size: 1.1rem;
        color: var(--olive-medium);
        letter-spacing: 3px;
        margin-bottom: 10px;
        display: block;
    }

    .event-type {
        font-family: 'Montserrat', sans-serif;
        font-size: 1.6rem;
        font-weight: 600;
        color: var(--text-main);
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    .event-place {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.8rem;
        color: var(--olive-dark);
        margin-bottom: 5px;
    }

    .event-address {
        font-family: 'Montserrat', sans-serif;
        font-size: 0.95rem;
        color: var(--olive-medium);
        line-height: 1.6;
        margin-bottom: 30px;
    }

    .event-btn {
        display: inline-block;
        padding: 16px 60px; /* Botón más largo como el de la imagen */
        background: var(--olive-dark);
        color: var(--white);
        text-decoration: none;
        letter-spacing: 3px;
        font-weight: 600;
        font-size: 0.9rem;
        text-transform: uppercase;
        border-radius: 8px; /* Bordes suavemente redondeados */
        transition: 0.4s ease;
        box-shadow: 0 4px 15px rgba(58, 90, 64, 0.2);
    }

    .event-btn:hover {
        background: var(--olive-medium);
        transform: translateY(-2px);
    }

        /* ANIMACIONES */
        .fade { opacity: 0; transform: translateY(30px); transition: 1.5s ease-out; }
        .fade.visible { opacity: 1; transform: translateY(0); }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Animación especial para el monograma de fondo */
        @keyframes fadeInScale { 
            from { opacity: 0; transform: translate(-50%, -50%) scale(1.1); } 
            to { opacity: 0.06; transform: translate(-50%, -50%) scale(1); } 
        }

        footer { padding: 80px 20px; font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--olive-dark); text-align: center; }
    </style>
</head>
<body>

    <div class="hero">
        <img src="img/monograma.png" class="hero-monograma-bg" alt="">
        
        <div class="hero-content">
            <h1>Luis &<br>Citlalli</h1>
            <p class="hero-date">11 . JULIO . 2026</p>
        </div>
    </div>

    <div class="photo-section fade">
        <img src="img/hero.jpg" class="main-photo" alt="Luis y Citlalli">
    </div>

    <section class="fade">
        <div class="dedicatoria">
            "Por encima de todo, vístanse de amor, que es el vínculo perfecto."
            <br>
            <span style="font-size: 1.2rem; font-style: normal; display: block; margin-top: 20px; letter-spacing: 3px; color: var(--olive-dark);">COLOSENSES 3:14</span>
        </div>
    </section>

    <div class="divider-png fade"><img src="img/divisor-1.png" alt="adorno botánico"></div>

    <section id="detalles" class="fade">
        <h2 class="section-title">Faltan</h2>
        <div class="countdown">
            <div class="time-box"><span id="days">0</span>Días</div>
            <div class="time-box"><span id="hours">0</span>Hr</div>
            <div class="time-box"><span id="minutes">0</span>Min</div>
            <div class="time-box"><span id="seconds">0</span>Seg</div>
        </div>
    </section>

    <div class="divider-png fade"><img src="img/divisor-1.png" alt="adorno botánico"></div>

   </section>

    <footer>♡ L & C ♡</footer>

    <script>
        // Lógica del contador
        const weddingDate = new Date("July 11, 2026 17:00:00").getTime();
        const updateTimer = () => {
            const now = new Date().getTime();
            const diff = weddingDate - now;
            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        };
        setInterval(updateTimer, 1000);
        updateTimer();

        // Observer para efectos fade al hacer scroll
        const observer = new IntersectionObserver(entries => {
            entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade').forEach(el => observer.observe(el));
    </script>
</body>
</html>
