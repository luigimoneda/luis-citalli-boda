<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luis & Citlalli | Nuestra Boda</title>
    
    <link rel="icon" type="image/png" href="img/monograma.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-cream: #f9f8f4;
            --white: #ffffff;
            --olive-dark: #3A5A40;
            --olive-medium: #6B705C;
            --text-main: #2c3e2f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- HERO: TEXTO CENTRAL QUE LLENA LA PANTALLA --- */
        .hero {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .hero h1 { 
            font-family: 'Cormorant Garamond', serif; 
            /* Tamaño gigante que se ajusta a la pantalla */
            font-size: clamp(3.5rem, 15vw, 8rem); 
            color: var(--olive-dark);
            line-height: 0.9;
            font-weight: 400;
            margin-bottom: 20px;
            animation: fadeInUp 1.5s ease;
        }

        .hero-date {
            letter-spacing: 8px;
            color: var(--olive-medium);
            font-size: clamp(0.7rem, 2vw, 1.2rem);
            text-transform: uppercase;
            animation: fadeIn 2s ease;
        }

        /* --- CONTENEDOR DE FOTO CON MONOGRAMA DE FONDO --- */
        .photo-wrap {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 80px;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El monograma gigante de fondo */
        .monograma-bg {
            position: absolute;
            width: 90%; /* Rellena gran parte de la sección */
            max-width: 800px;
            opacity: 0.08; /* Muy sutil para no ensuciar la foto */
            z-index: 1;
            pointer-events: none;
            filter: grayscale(1);
        }

        .main-photo {
            width: 100%;
            height: auto;
            position: relative;
            z-index: 2; /* Por encima del monograma */
            box-shadow: 0 20px 50px rgba(58, 90, 64, 0.15);
            border-radius: 2px;
        }

        /* SECCIONES POSTERIORES */
        section { padding: 80px 20px; max-width: 900px; margin: auto; text-align: center; }

        .dedicatoria {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-style: italic;
            color: var(--olive-medium);
            line-height: 1.3;
        }

        .section-title { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: var(--olive-dark);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .countdown { display: flex; justify-content: center; gap: 30px; }
        .time-box span { display: block; font-size: 3.5rem; font-family: 'Cormorant Garamond', serif; color: var(--olive-dark); font-weight: 600; }

        .event-card {
            background: var(--white);
            padding: 60px 40px;
            margin-bottom: 40px;
            border: 1px solid rgba(58, 90, 64, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        .event-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 40px;
            background: var(--olive-dark);
            color: white;
            text-decoration: none;
            letter-spacing: 2px;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.3s;
        }

        /* ANIMACIONES */
        .fade { opacity: 0; transform: translateY(30px); transition: 1.5s ease-out; }
        .fade.visible { opacity: 1; transform: translateY(0); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        footer { padding: 100px 20px; font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--olive-dark); }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Luis &<br>Citlalli</h1>
        <p class="hero-date">11 . JULIO . 2026</p>
    </div>

    <div class="photo-wrap fade">
        <img src="img/monograma.png" class="monograma-bg" alt="">
        <img src="img/hero.jpg" class="main-photo" alt="Luis y Citlalli">
    </div>

    <section class="fade">
        <div class="dedicatoria">
            "Por encima de todo, vístanse de amor, que es el vínculo perfecto."
            <br>
            <span style="font-size: 1.2rem; font-style: normal; display: block; margin-top: 20px; letter-spacing: 3px; color: var(--olive-dark);">COLOSENSES 3:14</span>
        </div>
    </section>

    <section id="detalles" class="fade">
        <h2 class="section-title">Faltan</h2>
        <div class="countdown">
            <div class="time-box"><span id="days">0</span>Días</div>
            <div class="time-box"><span id="hours">0</span>Hr</div>
            <div class="time-box"><span id="minutes">0</span>Min</div>
            <div class="time-box"><span id="seconds">0</span>Seg</div>
        </div>
    </section>

    <section class="fade">
        <div class="event-card">
            <h2 class="section-title" style="font-size: 2rem; margin-bottom: 10px;">Ceremonia</h2>
            <p><strong>5:00 PM</strong></p>
            <p>Parroquia Sagrado Corazón de Jesús</p>
            <a href="#" class="event-btn">Ver Ubicación</a>
        </div>

        <div class="event-card">
            <h2 class="section-title" style="font-size: 2rem; margin-bottom: 10px;">Recepción</h2>
            <p><strong>9:00 PM</strong></p>
            <p>Hacienda Elegancia</p>
            <a href="#" class="event-btn">Ver Ubicación</a>
        </div>
    </section>

    <footer>♡ L & C ♡</footer>

    <script>
        // Lógica del contador
        const weddingDate = new Date("July 11, 2026 17:00:00").getTime();
        const updateTimer = () => {
            const now = new Date().getTime();
            const diff = weddingDate - now;
            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        };
        setInterval(updateTimer, 1000);
        updateTimer();

        // Observer para efectos de aparición
        const observer = new IntersectionObserver(entries => {
            entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade').forEach(el => observer.observe(el));
    </script>
</body>
</html>
