<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luis & Citlalli | Nuestra Boda</title>
    
    <link rel="icon" type="image/png" href="img/monograma.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-cream: #f9f8f4;
            --white: #ffffff;
            --olive-dark: #3A5A40;
            --olive-medium: #6B705C;
            --text-main: #2c3e2f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            height: 100%;
            background-color: var(--bg-cream);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- PANTALLA DE APERTURA (SOBRE) --- */
        #sobre-apertura {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-cream);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999; /* Siempre arriba de todo */
            transition: opacity 1s ease, visibility 1s;
        }

        /* Efecto cuando se abre */
        #sobre-apertura.cerrado {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .sobre-contenido {
            text-align: center;
            animation: fadeIn 1.5s ease;
        }

        .btn-abrir {
            margin-top: 30px;
            padding: 12px 40px;
            background-color: var(--olive-dark);
            color: var(--white);
            border: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-abrir:hover {
            background-color: var(--olive-medium);
            letter-spacing: 5px;
        }

        /* --- RESTO DEL DISEÑO --- */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            opacity: 0.3; 
            pointer-events: none;
            z-index: -1; 
        }

        .hero {
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .monograma { 
            width: clamp(100px, 15vw, 130px); 
            margin-bottom: 20px; 
        }

        h1 { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: clamp(3rem, 10vw, 5.5rem); 
            color: var(--olive-dark);
            font-weight: 400;
        }

        .main-photo-container {
            width: 100%;
            max-width: 900px;
            margin: -40px auto 60px;
            padding: 0 20px;
        }

        .main-photo-container img {
            width: 100%;
            height: auto;
            box-shadow: 0 15px 40px rgba(58, 90, 64, 0.12);
        }

        section { padding: 60px 20px; max-width: 900px; margin: auto; }

        .section-title { 
            text-align: center; 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 2.2rem;
            margin-bottom: 30px;
            color: var(--olive-dark);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .dedicatoria {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.4rem, 4vw, 2.1rem);
            font-style: italic;
            color: var(--olive-medium);
            line-height: 1.5;
        }

        .event-card {
            background: var(--white);
            padding: 50px 30px;
            text-align: center; 
            box-shadow: 0 10px 30px rgba(58, 90, 64, 0.05);
            max-width: 550px;
            margin: 0 auto 40px auto; 
            border: 1px solid rgba(58, 90, 64, 0.08);
        }

        .countdown { display: flex; justify-content: center; gap: 20px; text-align: center; }
        .time-box span { display: block; font-size: 3rem; font-family: 'Cormorant Garamond', serif; color: var(--olive-dark); }

        .event-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 35px;
            background-color: var(--olive-dark);
            color: var(--white);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .fade { opacity: 0; transform: translateY(30px); transition: 1.2s ease-out; }
        .fade.visible { opacity: 1; transform: translateY(0); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        footer { text-align: center; padding: 80px 20px; font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; color: var(--olive-dark); }
    </style>
</head>
<body>

    <div id="sobre-apertura">
        <div class="sobre-contenido">
            <img src="img/monograma.png" alt="Monograma" class="monograma">
            <h2 style="font-family: 'Cormorant Garamond', serif; color: var(--olive-dark); font-weight: 400; letter-spacing: 2px;">Nuestra Boda</h2>
            <button class="btn-abrir" onclick="abrirInvitacion()">Abrir</button>
        </div>
    </div>

    <div id="contenido-invitacion">
        <section class="hero">
            <div class="hero-content">
                <img src="img/monograma.png" alt="Monograma" class="monograma">
                <h1>Luis & Citlalli</h1>
                <p style="letter-spacing: 5px; color: var(--olive-medium); font-weight: 600;">11 . JULIO . 2026</p>
            </div>
        </section>

        <div class="main-photo-container fade">
            <img src="img/hero.jpg" alt="Nuestra Foto">
        </div>

        <section class="fade">
            <div class="dedicatoria">
                "Por encima de todo, vístanse de amor, que es el vínculo perfecto."
                <br>
                <span style="font-size: 1.1rem; font-style: normal; display: block; margin-top: 15px; letter-spacing: 2px; color: var(--olive-dark);">COLOSENSES 3:14</span>
            </div>
        </section>

        <section id="detalles" class="fade">
            <h2 class="section-title">Faltan</h2>
            <div class="countdown">
                <div class="time-box"><span id="days">0</span>Días</div>
                <div class="time-box"><span id="hours">0</span>Hr</div>
                <div class="time-box"><span id="minutes">0</span>Min</div>
                <div class="time-box"><span id="seconds">0</span>Seg</div>
            </div>
        </section>

        <section class="fade">
            <div class="event-card">
                <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: var(--olive-dark); margin-bottom: 10px;">Ceremonia</h2>
                <p><strong>5:00 PM</strong></p>
                <p>Parroquia Sagrado Corazón de Jesús</p>
                <a href="https://maps.app.goo.gl/xxxx" target="_blank" class="event-btn">Ubicación</a>
            </div>

            <div class="event-card">
                <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: var(--olive-dark); margin-bottom: 10px;">Recepción</h2>
                <p><strong>9:00 PM</strong></p>
                <p>Hacienda Elegancia</p>
                <a href="https://maps.app.goo.gl/xxxx" target="_blank" class="event-btn">Ubicación</a>
            </div>
        </section>

        <footer>♡ L & C ♡</footer>
    </div>

    <script>
        // Función para ocultar el sobre
        function abrirInvitacion() {
            const sobre = document.getElementById('sobre-apertura');
            sobre.classList.add('cerrado');
            
            // Opcional: Iniciar música aquí si la añades después
        }

        // Contador
        const weddingDate = new Date("July 11, 2026 17:00:00").getTime();
        const updateTimer = () => {
            const now = new Date().getTime();
            const diff = weddingDate - now;
            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        };
        setInterval(updateTimer, 1000);

        // Animación Fade al Scroll
        const observer = new IntersectionObserver(entries => {
            entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade').forEach(el => observer.observe(el));
    </script>
</body>
</html>
